<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardioGuard — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0e27,#151b2d,#0d1117);color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
body::before{content:'';position:absolute;top:-50%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(255,71,87,.15) 0%,transparent 70%);border-radius:50%;animation:float 8s ease-in-out infinite;z-index:0}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
.card{position:relative;z-index:1;background:rgba(22,27,34,.7);border:1px solid rgba(255,71,87,.2);border-radius:20px;padding:48px;width:100%;max-width:420px;text-align:center;backdrop-filter:blur(10px)}
.logo{font-size:40px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:28px}
.form-group{text-align:left;margin-bottom:18px}
label{font-size:13px;color:#94a3b8;display:block;margin-bottom:6px;font-weight:500}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,71,87,.2);border-radius:10px;color:#f1f5f9;font-size:14px;outline:none}
input:focus{border-color:#ff4757}
.btn{width:100%;padding:13px;background:#ff4757;color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;transition:all .3s}
.btn:hover{background:#ff5a6b;transform:translateY(-2px)}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.alert.error{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:#fca5a5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔒</div>
  <h1>Nouveau mot de passe</h1>
  <p class="sub">Choisissez un nouveau mot de passe sécurisé</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" name="password" placeholder="Minimum 6 caractères" minlength="6" required>
    </div>
    <button type="submit" class="btn">Confirmer →</button>
  </form>
</div>
</body>
</html>
